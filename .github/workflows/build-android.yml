name: Build Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed debug APK from bundled assets
        run: python3 build_apk.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: Doseleaf-Android-Preview
          path: build/Doseleaf-Android-Preview.apk
